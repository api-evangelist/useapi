generated: '2026-07-27'
method: derived
source: openapi/ (derived from the first-party useapi.net Postman collections) + https://useapi.net/docs
note: 'useapi.net has no single shared data model. Each of the ten APIs projects the object model of the site it
  wraps, so entity names, identifier names and lifecycles differ per service. What IS shared is the shape of the
  graph: a subscription owns linked upstream Accounts, an Account executes Jobs, and a Job produces media Assets.
  The per-service resources below are derived from the path structure of each captured contract.'
core_graph:
  entities:
  - name: Subscription
    description: The useapi.net account itself, identified by the bearer token user:<number>-<unique-string>. Carries
      the default replyUrl webhook. Surfaced by GET /v2/account.
    id_field: user:<number>
  - name: LinkedAccount
    description: A caller-owned account on the wrapped AI service, registered with browser cookies or a session
      token. Selected per request or chosen by the load balancer. Carries health state (executing / completed /
      failed / rateLimited) and quarantine state.
    id_field: 'varies: email (google-flow, flowmusic), account (dreamina, kling), channel_id (faceswap)'
  - name: Job
    description: A single generation request executed against a LinkedAccount. Asynchronous on most services. Terminal
      state fires the replyUrl webhook. Retained 7 days.
    id_field: 'varies: jobid, jobId, taskId, musicId'
  - name: Asset
    description: Input or output media (image, video, audio) uploaded to or produced by a Job.
    id_field: 'varies: assetId, mediaGenerationId, clip_id'
  - name: Reference
    description: Reusable named inputs on the services that support them — Google Flow characters and voices, Kling
      elements and custom voices, Mureka vocal references.
    id_field: ref
  - name: UsageRecord
    description: A logged API call, queryable via GET /v2/account/stats by bot, date, config, endpoint, model, HTTP
      status and tier. 5-15 min latency, 3 month retention.
    id_field: none — aggregate only
  relationships:
  - from: Subscription
    to: LinkedAccount
    type: has_many
    via: per-service /accounts collection
  - from: LinkedAccount
    to: Job
    type: has_many
    via: account selector on the generation request
  - from: Job
    to: Asset
    type: has_many
    via: job result payload
  - from: Job
    to: LinkedAccount
    type: belongs_to
    via: email / account / channel_id
  - from: Asset
    to: LinkedAccount
    type: belongs_to
    via: upload path, e.g. POST /assets/{account}
  - from: Reference
    to: Subscription
    type: belongs_to
    via: ref namespace scoped to the token
  - from: Subscription
    to: UsageRecord
    type: has_many
    via: GET /v2/account/stats
identifier_heterogeneity:
  warning: The vendor states explicitly that identifier names vary per API. Do not write a generic client that assumes
    a single id field.
  observed:
  - jobid
  - jobId
  - taskId
  - musicId
  - assetId
  - mediaGenerationId
  - clip_id
  - ref
  - email
  - account
  - channel_id
