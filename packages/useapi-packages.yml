method: searched
source: >-
  npm registry search, PyPI, and the github.com/useapi organization. Registries probed with no
  first-party useapi.net result: PyPI (useapi, useapi-net), Maven Central, NuGet, pkg.go.dev,
  RubyGems, Packagist, crates.io.
summary:
  official_client_libraries: 2
  official_example_repositories: 11
  note: >-
    useapi.net does not ship a generated SDK for its ten current APIs. The only published client
    libraries are the TypeScript and Python clients for the now-retired Midjourney API, both built
    from the SwaggerHub OpenAPI definitions. For the current APIs the vendor's own distribution
    channel is per-service runnable example repositories on GitHub plus the Postman collections
    indexed in /.well-known/api-catalog.
