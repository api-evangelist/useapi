- aid: useapi:account-v2
  name: useapi.net Account Management API v2
  description: >-
    Cross-cutting account API for the useapi.net subscription itself — retrieve account details and the
    configured service accounts, set the default replyUrl webhook applied to every API, and query per-bot
    usage statistics broken down by config, endpoint, model, status code and tier. Statistics carry 5–15
    minutes of latency and are retained for three months.
  humanURL: https://useapi.net/docs/account-management
