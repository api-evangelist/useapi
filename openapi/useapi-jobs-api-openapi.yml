              schema:
                $ref: '#/components/schemas/blendResponse'
        '400':
          description: blendUrls, discord, server or channel value is missing | one of blendUrls values not a valid URL or URL which can not be retrieved | replyRef or replyUrl is too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blendResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blendResponse'
        '402':
          description: Account has no subscription or subscription expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blendResponse'
        '422':
          description: Moderated image link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blendResponse'
        '429':
